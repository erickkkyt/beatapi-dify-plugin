identity:
  author: erickkkyt
  name: beatapi
  label:
    en_US: BeatAPI
    zh_Hans: BeatAPI
  description:
    en_US: Build image, video, Effect, and music-video workflows with BeatAPI's asynchronous API.
    zh_Hans: 使用 BeatAPI 异步 API 构建图片、视频、Effect 和音乐视频工作流。
  icon: icon.svg
  tags:
    - videos
    - entertainment

credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: BeatAPI API Key
      zh_Hans: BeatAPI API Key
    placeholder:
      en_US: sk-...
      zh_Hans: sk-...
    help:
      en_US: Create a revocable API key in the BeatAPI dashboard.
      zh_Hans: 在 BeatAPI 控制台创建可随时撤销的 API Key。
    url: https://beatapi.io/dashboard/apikeys

tools:
  - tools/web_search.yaml
  - tools/web_read.yaml
  - tools/web_map.yaml
  - tools/web_research.yaml
  - tools/search_capabilities.yaml
  - tools/inspect_capability.yaml
  - tools/run_capability.yaml
  - tools/list_generation_models.yaml
  - tools/create_image_task.yaml
  - tools/create_video_task.yaml
  - tools/list_effects.yaml
  - tools/get_effect.yaml
  - tools/create_effect_task.yaml
  - tools/create_music_video_task.yaml
  - tools/get_task.yaml

extra:
  python:
    source: provider/beatapi.py
