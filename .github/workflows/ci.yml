name: Validate and package Dify plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run behavior tests
        run: PYTHONPATH=. uv run python -m unittest discover -s tests -v

      - name: Install Dify CLI
        run: |
          gh release download --repo langgenius/dify-plugin-daemon --pattern dify-plugin-linux-amd64 --dir /tmp/dify-cli
          chmod +x /tmp/dify-cli/dify-plugin-linux-amd64

      - name: Package plugin
        run: /tmp/dify-cli/dify-plugin-linux-amd64 plugin package . -o beatapi-${{ github.ref_name }}.difypkg

      - uses: actions/upload-artifact@v4
        with:
          name: beatapi-dify-plugin
          path: "*.difypkg"

      - name: Attach package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.difypkg"
